<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Configuration Side -->
        <div class="controls">
            <h1>Spin</h1>

            <div class="input-group">
                <label for="options">Options (one per line)</label>
                <textarea id="options" rows="6" placeholder="Option 1&#10;Option 2&#10;Option 3"></textarea>
            </div>

            <div class="input-group">
                <label for="multiplier">Fields per option: <span id="multiplierValue">1</span></label>
                <input type="range" id="multiplier" min="1" max="30" value="1">
            </div>

            <div class="input-group">
                <label>
                    <input type="checkbox" id="soundToggle" checked> Enable Sound
                </label>
            </div>

            <div class="input-group">
                <label for="duration">Duration: <span id="durationValue">3s</span></label>
                <input type="range" id="duration" min="1" max="60" value="3" step="1">
            </div>

            <p id="summary" class="summary-text">Spinning wheel with 0 fields.</p>

            <button id="spinBtn">SPIN</button>
        </div>

        <!-- Wheel Side -->
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="arrow"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
