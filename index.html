<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'><path d='M5 5 A 16 16 0 0 1 21 21' stroke='%234ecdc4' stroke-width='8'/><path d='M21 21 A 16 16 0 0 1 5 37' stroke='%23ffe66d' stroke-width='8'/><path d='M30 13 V 29 L14 21 Z' fill='%23333' stroke='white' stroke-width='2'/></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Configuration Side -->
        <div class="controls">
            <h1 style="display: flex; align-items: center; gap: 15px;">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6 A 16 16 0 0 1 20 20" stroke="#4ecdc4" stroke-width="8" stroke-linecap="butt" />
        
                <path d="M20 20 A 16 16 0 0 1 4 34" stroke="#ffe66d" stroke-width="8" stroke-linecap="butt" />
        
                <path d="M28 12 V 28 L12 20 L28 12 Z" fill="#333" stroke="white" stroke-width="3" stroke-linejoin="round"/>
                </svg>
            Spin
            </h1>

            <div class="input-group">
                <label for="options">Options (one per line)</label>
                <textarea id="options" rows="6" placeholder="Option 1&#10;Option 2&#10;Option 3"></textarea>
            </div>

            <div class="input-group">
                <label for="multiplier">Fields per option: <span id="multiplierValue">1</span></label>
                <input type="range" id="multiplier" min="1" max="30" value="1">
            </div>

            <div class="input-group">
                <label>
                    <input type="checkbox" id="soundToggle" checked> Enable Sound
                </label>
            </div>

            <div class="input-group">
                <label for="duration">Duration: <span id="durationValue">3s</span></label>
                <input type="range" id="duration" min="1" max="60" value="3" step="1">
            </div>

            <p id="summary" class="summary-text">Spinning wheel with 0 fields.</p>

            <button id="spinBtn">SPIN</button>
        </div>

        <!-- Wheel Side -->
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="arrow"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
