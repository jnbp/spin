<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin</title>
  <meta name="description" content="A lucky wheel for the browser: add entries, spin, get a result.">
  <meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14162b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'><path d='M5 5 A 16 16 0 0 1 21 21' stroke='%2322b8ad' stroke-width='8'/><path d='M21 21 A 16 16 0 0 1 5 37' stroke='%23ffd23f' stroke-width='8'/><path d='M30 13 V 29 L14 21 Z' fill='%231b1f3b' stroke='white' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('spin:v2') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Spin">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M4 6 A 16 16 0 0 1 20 20" stroke="var(--teal)" stroke-width="8"/>
        <path d="M20 20 A 16 16 0 0 1 4 34" stroke="var(--sun)" stroke-width="8"/>
        <path d="M28 12 V 28 L12 20 Z" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <span>Spin</span>
    </a>

    <div class="top-actions">
      <div class="seg-toggle" role="group" data-i18n-title="language" data-active="de">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" data-i18n-title="theme">
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="shareBtn" data-i18n-title="share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button type="button" class="icon-btn" id="fullscreenBtn" data-i18n-title="fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-entries" aria-controls="pane-entries" aria-selected="true" data-i18n="entries"></button>
        <button type="button" role="tab" id="tab-history" aria-controls="pane-history" aria-selected="false">
          <span data-i18n="history"></span> <span class="count" id="historyCount" hidden></span>
        </button>
        <button type="button" role="tab" id="tab-settings" aria-controls="pane-settings" aria-selected="false" data-i18n="settings"></button>
        <span class="tab-ink" id="tabInk" aria-hidden="true"></span>
      </div>

      <section class="pane" id="pane-entries" role="tabpanel" aria-labelledby="tab-entries">
        <textarea id="entries" spellcheck="false" aria-labelledby="tab-entries" aria-describedby="entriesHint" data-i18n-placeholder="entriesPlaceholder"></textarea>
        <p class="hint" id="entriesHint" data-i18n="entriesHint"></p>

        <div class="toolbar">
          <details class="menu" id="presetMenu">
            <summary class="chip" data-i18n="presets"></summary>
            <div class="menu-list" id="presetList"></div>
          </details>
          <button type="button" class="chip" id="shuffleBtn" data-i18n="shuffle"></button>
          <button type="button" class="chip" id="clearBtn" data-i18n="clear"></button>
          <button type="button" class="chip chip-accent" id="restoreBtn" hidden></button>
        </div>

        <label class="field">
          <span class="field-row"><span data-i18n="fieldsPerEntry"></span><output id="perEntryOut">1</output></span>
          <input type="range" id="perEntry" min="1" max="50" value="1">
        </label>
      </section>

      <section class="pane" id="pane-history" role="tabpanel" aria-labelledby="tab-history" hidden>
        <p class="hint" id="historyEmpty" data-i18n="historyEmpty"></p>
        <ol class="history" id="historyList"></ol>
        <button type="button" class="chip" id="clearHistoryBtn" data-i18n="clearHistory" hidden></button>
      </section>

      <section class="pane" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <label class="field">
          <span class="field-row"><span data-i18n="duration"></span><output id="durationOut">5 s</output></span>
          <input type="range" id="duration" min="1" max="30" value="5">
        </label>
        <label class="field">
          <span data-i18n="physics"></span>
          <select id="physics">
            <option value="medium" data-i18n="physicsMedium"></option>
            <option value="heavy" data-i18n="physicsHeavy"></option>
            <option value="random" data-i18n="physicsRandom"></option>
            <option value="linear" data-i18n="physicsLinear"></option>
          </select>
        </label>
        <label class="switch"><input type="checkbox" id="sound"><span data-i18n="sound"></span></label>
        <label class="switch"><input type="checkbox" id="confetti"><span data-i18n="confetti"></span></label>
        <label class="switch"><input type="checkbox" id="autoRemove"><span data-i18n="autoRemove"></span></label>
      </section>

      <div class="panel-foot">
        <button type="button" class="btn btn-primary btn-block" id="panelSpinBtn" data-i18n="spin"></button>
      </div>
    </aside>

    <section class="stage" id="stage">
      <button type="button" class="icon-btn stage-exit" id="exitFsBtn" data-i18n-title="exitFullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <div class="wheel-wrap">
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Spin"></canvas>
        <button type="button" class="hub" id="spinBtn"><span data-i18n="spin"></span></button>
        <p class="empty-note" id="emptyNote" data-i18n="emptyWheel"></p>
      </div>
      <div class="cancel-bar" id="cancelBar" role="alertdialog" aria-labelledby="cancelText" hidden>
        <p id="cancelText" data-i18n="cancelQuestion"></p>
        <div class="cancel-actions">
          <button type="button" class="btn btn-danger" id="cancelYes" data-i18n="cancelConfirm"></button>
          <button type="button" class="btn" id="cancelNo" data-i18n="keepSpinning"></button>
        </div>
      </div>
      <p class="summary" id="summary" aria-live="polite"></p>
      <p class="key-hint" data-i18n="keyHint"></p>
    </section>
  </main>

  <dialog id="result" aria-labelledby="resultLabel">
    <p class="result-label" id="resultLabel" data-i18n="winner"></p>
    <p class="result-name" id="resultName"></p>
    <div class="result-actions">
      <button type="button" class="btn btn-primary" id="againBtn" data-i18n="spinAgain"></button>
      <button type="button" class="btn" id="removeBtn" data-i18n="remove"></button>
      <button type="button" class="btn btn-quiet" id="closeBtn" data-i18n="close"></button>
    </div>
  </dialog>

  <canvas id="confettiLayer" popover="manual" aria-hidden="true"></canvas>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
